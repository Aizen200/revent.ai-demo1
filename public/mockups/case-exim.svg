<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 1048" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2141"/>
      <stop offset="1" stop-color="#007aff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#d6e6ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f1ff"/>
      <stop offset="1" stop-color="#d3e6ff"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#004fba" flood-opacity="0.16"/>
    </filter>
    <filter id="pin" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#004fba" flood-opacity="0.25"/>
    </filter>
    <clipPath id="map"><rect x="252" y="168" width="772" height="336" rx="16"/></clipPath>
  </defs>

  <rect width="1184" height="1048" fill="url(#bg)"/>

  <g transform="translate(64 72)">
    <rect width="1056" height="904" rx="24" fill="#fff" filter="url(#sh)"/>
    <circle cx="30" cy="28" r="6.5" fill="#ff5f57"/>
    <circle cx="52" cy="28" r="6.5" fill="#febc2e"/>
    <circle cx="74" cy="28" r="6.5" fill="#28c840"/>
    <text x="528" y="33" text-anchor="middle" font-size="15" fill="#1c2141" fill-opacity="0.5">Revent MIS · EXIM Desk</text>
    <rect y="56" width="1056" height="1" fill="#007aff" fill-opacity="0.12"/>

    <!-- sidebar -->
    <path d="M0 57h220v847H24a24 24 0 0 1-24-24z" fill="#f5f9ff"/>
    <rect x="24" y="84" width="34" height="34" rx="9" fill="#007aff"/>
    <text x="41" y="107" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">G</text>
    <text x="70" y="99" font-size="15" font-weight="600" fill="#1c2141">Gulf Link EXIM</text>
    <text x="70" y="116" font-size="12" fill="#1c2141" fill-opacity="0.5">Dubai</text>
    <rect x="16" y="150" width="188" height="40" rx="10" fill="#e1eeff"/>
    <g font-size="15" fill="#1c2141" fill-opacity="0.7">
      <text x="44" y="175" fill="#007aff" fill-opacity="1" font-weight="600">Containers</text>
      <text x="44" y="221">Bookings</text>
      <text x="44" y="269">Documents</text>
      <text x="44" y="317">Order pipeline</text>
      <text x="44" y="365">Clients</text>
    </g>
    <g fill="#007aff">
      <rect x="28" y="165" width="8" height="8" rx="2"/>
      <rect x="28" y="211" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="259" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="307" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="355" width="8" height="8" rx="2" opacity="0.35"/>
    </g>

    <!-- header -->
    <text x="252" y="112" font-size="28" font-weight="600" fill="#1c2141" letter-spacing="-0.5">Container tracking</text>
    <text x="252" y="140" font-size="15" fill="#1c2141" fill-opacity="0.55">38 active · 6 arriving this week</text>
    <rect x="884" y="88" width="140" height="36" rx="10" fill="#007aff"/>
    <text x="954" y="111" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">+ New booking</text>

    <!-- map -->
    <g clip-path="url(#map)">
      <rect x="252" y="168" width="772" height="336" fill="url(#sea)"/>
      <g fill="#fff" fill-opacity="0.9">
        <!-- Europe -->
        <path d="M330 160c60-10 130 0 190 20 30 10 20 40-10 50-40 14-60 6-90 20-30 14-60 10-90 0-20-8-40-30-30-50 6-14 14-36 30-40z"/>
        <!-- Africa -->
        <path d="M300 300c40-20 110-24 170-10 30 8 40 30 36 60-6 50-30 90-50 130-14 28-40 40-70 30-30-10-36-40-50-70-12-26-40-40-50-70-6-24-6-60 14-70z"/>
        <!-- Middle East / Arabia -->
        <path d="M560 250c30-8 70 0 90 24 18 22 10 50-14 70-20 16-50 22-70 8-24-16-34-44-30-70 2-16 10-28 24-32z"/>
        <!-- India -->
        <path d="M700 260c30-6 60 4 70 28 8 20-4 40-14 60-12 24-22 60-40 64-14 4-24-20-30-40-10-30-20-60-14-84 4-16 14-24 28-28z"/>
        <!-- East -->
        <path d="M800 190c60-10 140-4 210 20v100c-40 10-80 6-120 14-30 6-60 0-80-20-24-24-36-60-24-90 2-12 6-22 14-24z"/>
      </g>
      <g fill="none" stroke="#007aff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10">
        <path d="M632 318C680 330 700 340 722 356"/>
        <path d="M632 318C560 360 480 360 340 340"/>
        <path d="M632 318C600 260 500 220 420 210"/>
      </g>
      <!-- ship -->
      <g transform="translate(520 352)">
        <circle r="18" fill="#fff" filter="url(#pin)"/>
        <path d="M-9 1h18l-4 7h-10zM-5 1v-7h8l3 7" fill="#007aff"/>
      </g>
    </g>
    <!-- pins -->
    <g filter="url(#pin)">
      <circle cx="632" cy="318" r="11" fill="#007aff" stroke="#fff" stroke-width="4"/>
      <circle cx="722" cy="356" r="8" fill="#fff" stroke="#007aff" stroke-width="4"/>
      <circle cx="340" cy="340" r="8" fill="#fff" stroke="#007aff" stroke-width="4"/>
      <circle cx="420" cy="210" r="8" fill="#fff" stroke="#007aff" stroke-width="4"/>
    </g>
    <g font-size="13" font-weight="600" fill="#1c2141">
      <rect x="600" y="276" width="96" height="26" rx="8" fill="#1c2141"/>
      <text x="648" y="294" text-anchor="middle" fill="#fff">Jebel Ali</text>
      <text x="738" y="361">Nhava Sheva</text>
      <text x="300" y="370">Dakar</text>
      <text x="436" y="206">Rotterdam</text>
    </g>
    <rect x="252" y="168" width="772" height="336" rx="16" fill="none" stroke="#007aff" stroke-opacity="0.14" stroke-width="1.5"/>
    <g filter="url(#pin)">
      <rect x="760" y="420" width="244" height="64" rx="14" fill="url(#ai)"/>
    </g>
    <path transform="translate(784 452)" d="M0-10C1-3 3-1 10 0 3 1 1 3 0 10-1 3-3 1-10 0-3-1-1-3 0-10z" fill="#fff"/>
    <text x="806" y="447" font-size="14" font-weight="600" fill="#fff">AI: CMAU 330765-1</text>
    <text x="806" y="466" font-size="12" fill="#fff" fill-opacity="0.75">Likely 2-day customs delay</text>

    <!-- table -->
    <rect x="252" y="528" width="772" height="232" rx="16" fill="#fff" stroke="#007aff" stroke-opacity="0.14" stroke-width="1.5"/>
    <g font-size="13" fill="#1c2141" fill-opacity="0.5" font-weight="600" letter-spacing="0.4">
      <text x="276" y="560">CONTAINER</text>
      <text x="470" y="560">ROUTE</text>
      <text x="760" y="560">ETA</text>
      <text x="870" y="560">STATUS</text>
    </g>
    <g fill="#007aff" fill-opacity="0.12">
      <rect x="252" y="576" width="772" height="1"/>
      <rect x="252" y="636" width="772" height="1"/>
      <rect x="252" y="696" width="772" height="1"/>
    </g>
    <g font-size="15" fill="#1c2141">
      <text x="276" y="604" font-weight="600">MSCU 482117-3</text>
      <text x="276" y="624" font-size="12" fill-opacity="0.5">40' HC · Garments</text>
      <text x="470" y="613">Jebel Ali → Nhava Sheva</text>
      <text x="760" y="613">19 Oct</text>

      <text x="276" y="664" font-weight="600">TGHU 902281-6</text>
      <text x="276" y="684" font-size="12" fill-opacity="0.5">20' · Machinery</text>
      <text x="470" y="673">Jebel Ali → Dakar</text>
      <text x="760" y="673">27 Oct</text>

      <text x="276" y="724" font-weight="600">CMAU 330765-1</text>
      <text x="276" y="744" font-size="12" fill-opacity="0.5">40' · Dates &amp; spices</text>
      <text x="470" y="733">Jebel Ali → Rotterdam</text>
      <text x="760" y="733">02 Nov</text>
    </g>
    <g font-size="13" font-weight="600" text-anchor="middle">
      <rect x="870" y="594" width="96" height="26" rx="13" fill="#e1eeff"/>
      <text x="918" y="612" fill="#007aff">In transit</text>
      <rect x="870" y="654" width="96" height="26" rx="13" fill="#eef1f6"/>
      <text x="918" y="672" fill="#1c2141" fill-opacity="0.65">Loading</text>
      <rect x="870" y="714" width="96" height="26" rx="13" fill="#fef3c7"/>
      <text x="918" y="732" fill="#b45309">Customs</text>
    </g>

    <!-- docs -->
    <text x="252" y="806" font-size="17" font-weight="600" fill="#1c2141">Export documents · MSCU 482117-3</text>
    <g font-size="14" font-weight="600" fill="#1c2141">
      <rect x="252" y="824" width="176" height="48" rx="12" fill="#f5f9ff"/>
      <circle cx="276" cy="848" r="10" fill="#16a34a"/>
      <path d="M271 848l3.5 3.5 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="296" y="853">Bill of lading</text>

      <rect x="444" y="824" width="176" height="48" rx="12" fill="#f5f9ff"/>
      <circle cx="468" cy="848" r="10" fill="#16a34a"/>
      <path d="M463 848l3.5 3.5 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="488" y="853">Packing list</text>

      <rect x="636" y="824" width="196" height="48" rx="12" fill="#f5f9ff"/>
      <circle cx="660" cy="848" r="10" fill="#16a34a"/>
      <path d="M655 848l3.5 3.5 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="680" y="853">Commercial inv.</text>

      <rect x="848" y="824" width="176" height="48" rx="12" fill="url(#ai)"/>
      <path transform="translate(872 848)" d="M0-9C.8-2.5 2.5-.8 9 0 2.5.8.8 2.5 0 9-.8 2.5-2.5.8-9 0-2.5-.8-.8-2.5 0-9z" fill="#fff"/>
      <text x="892" y="845" fill="#fff">Cert. of origin</text>
      <text x="892" y="862" font-size="11" font-weight="500" fill="#fff" fill-opacity="0.7">AI drafting…</text>
    </g>
  </g>
</svg>
