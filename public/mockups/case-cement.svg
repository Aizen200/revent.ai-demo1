      <text x="276" y="242" font-size="30" font-weight="600" fill="#1c2141" letter-spacing="-0.5">2,840 t</text>
      <text x="472" y="242" text-anchor="end" font-size="13" font-weight="600" fill="#16a34a">+6%</text>

      <rect x="516" y="168" width="244" height="104" rx="16" fill="#f5f9ff"/>
      <text x="540" y="200" font-size="14" fill="#1c2141" fill-opacity="0.55">Capacity used</text>
      <text x="540" y="242" font-size="30" font-weight="600" fill="#1c2141" letter-spacing="-0.5">82%</text>
      <rect x="626" y="230" width="110" height="10" rx="5" fill="#d6e4f7"/>
      <rect x="626" y="230" width="90" height="10" rx="5" fill="#007aff"/>

      <rect x="780" y="168" width="244" height="104" rx="16" fill="#f5f9ff"/>
      <text x="804" y="200" font-size="14" fill="#1c2141" fill-opacity="0.55">Trucks dispatched</text>
      <text x="804" y="242" font-size="30" font-weight="600" fill="#1c2141" letter-spacing="-0.5">64</text>
      <text x="1000" y="242" text-anchor="end" font-size="13" fill="#1c2141" fill-opacity="0.5">of 72 booked</text>
