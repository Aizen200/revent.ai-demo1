      <text x="398" y="562" font-weight="600">64%</text>
      <text x="398" y="582" fill-opacity="0.5">Clinker</text>
      <text x="484" y="562" font-weight="600" fill="#b45309">31%</text>
      <text x="484" y="582" fill-opacity="0.5">Gypsum</text>
      <text x="570" y="562" font-weight="600">52%</text>
      <text x="570" y="582" fill-opacity="0.5">Fly ash</text>
    </g>

