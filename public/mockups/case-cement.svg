    <path transform="translate(434 326)" d="M0-7C.6-2 2-.6 7 0 2 .6.6 2 0 7-.6 2-2 .6-7 0-2-.6-.6-2 0-7z" fill="#fff"/>
    <text x="448" y="331" font-size="13" fill="#fff" font-weight="600">Gypsum out in 3 days</text>
    <g>
      <!-- each silo: 56 wide, 180 tall, top y=356 -->
      <rect x="284" y="356" width="56" height="180" rx="14" fill="#eef4fc"/>
      <rect x="284" y="396" width="56" height="140" rx="14" fill="url(#fill)"/>
      <rect x="370" y="356" width="56" height="180" rx="14" fill="#eef4fc"/>
      <rect x="370" y="421" width="56" height="115" rx="14" fill="url(#fill)"/>
      <rect x="456" y="356" width="56" height="180" rx="14" fill="#eef4fc"/>
      <rect x="456" y="480" width="56" height="56" rx="14" fill="#f59e0b"/>
      <rect x="542" y="356" width="56" height="180" rx="14" fill="#eef4fc"/>
      <rect x="542" y="442" width="56" height="94" rx="14" fill="url(#fill)"/>
    </g>
