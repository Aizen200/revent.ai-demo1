    <g fill="#007aff" fill-opacity="0.1">
      <rect x="790" y="372" width="1" height="204"/>
      <rect x="852" y="372" width="1" height="204"/>
      <rect x="914" y="372" width="1" height="204"/>
      <rect x="976" y="372" width="1" height="204"/>
    </g>
    <g font-size="13" fill="#1c2141">
      <text x="672" y="398">Kiln 1</text>
      <text x="672" y="440">Raw mill</text>
      <text x="672" y="482">Cement mill 1</text>
      <text x="672" y="524">Cement mill 2</text>
      <text x="672" y="566">Packing</text>
    </g>
    <g>
      <rect x="770" y="382" width="230" height="22" rx="7" fill="#007aff"/>
      <rect x="770" y="424" width="120" height="22" rx="7" fill="#007aff"/>
      <rect x="900" y="424" width="100" height="22" rx="7" fill="#007aff" fill-opacity="0.45"/>
      <rect x="770" y="466" width="70" height="22" rx="7" fill="url(#hatch)" stroke="#f59e0b" stroke-opacity="0.6"/>
      <rect x="848" y="466" width="152" height="22" rx="7" fill="#007aff"/>
      <rect x="790" y="508" width="180" height="22" rx="7" fill="#007aff" fill-opacity="0.45"/>
      <rect x="800" y="550" width="80" height="22" rx="7" fill="#007aff"/>
      <rect x="890" y="550" width="96" height="22" rx="7" fill="#007aff"/>
    </g>

    <!-- compliance -->
    <rect x="252" y="624" width="376" height="252" rx="16" fill="#f5f9ff"/>
    <text x="276" y="658" font-size="17" font-weight="600" fill="#1c2141">Compliance documents</text>
    <g font-size="14">
      <circle cx="288" cy="698" r="12" fill="#16a34a"/>
      <path d="M282 698l4 4 7-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="312" y="694" font-weight="600" fill="#1c2141">Emission report · Oct</text>
      <text x="312" y="712" font-size="12" fill="#1c2141" fill-opacity="0.5">Filed 02 Oct</text>

      <circle cx="288" cy="756" r="12" fill="#16a34a"/>
      <path d="M282 756l4 4 7-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="312" y="752" font-weight="600" fill="#1c2141">Quality cert · CEM II 42.5</text>
      <text x="312" y="770" font-size="12" fill="#1c2141" fill-opacity="0.5">Batch 1187 · auto-attached</text>

      <circle cx="288" cy="814" r="12" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/>
      <rect x="287" y="808" width="2.5" height="7" rx="1" fill="#f59e0b"/>
      <text x="312" y="810" font-weight="600" fill="#1c2141">Safety audit</text>
      <text x="312" y="828" font-size="12" fill="#b45309">Due 22 Oct</text>
    </g>

    <!-- dispatch queue -->
    <rect x="648" y="624" width="376" height="252" rx="16" fill="#f5f9ff"/>
    <text x="672" y="658" font-size="17" font-weight="600" fill="#1c2141">Truck queue</text>
    <text x="1000" y="658" text-anchor="end" font-size="13" fill="#1c2141" fill-opacity="0.5">8 waiting</text>
    <g font-size="14" fill="#1c2141">
      <rect x="668" y="676" width="336" height="54" rx="12" fill="#fff"/>
      <text x="688" y="700" font-weight="600">DK-4471-A</text>
      <text x="688" y="718" font-size="12" fill-opacity="0.5">40 t · Bay 2</text>
      <rect x="900" y="690" width="88" height="26" rx="13" fill="#e1eeff"/>
      <text x="944" y="708" text-anchor="middle" font-size="12" font-weight="600" fill="#007aff">Loading</text>

      <rect x="668" y="738" width="336" height="54" rx="12" fill="#fff"/>
      <text x="688" y="762" font-weight="600">DK-2208-C</text>
      <text x="688" y="780" font-size="12" fill-opacity="0.5">32 t · Bay 1</text>
      <rect x="900" y="752" width="88" height="26" rx="13" fill="#dcfce7"/>
      <text x="944" y="770" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">Weighed</text>

      <rect x="668" y="800" width="336" height="54" rx="12" fill="#fff"/>
      <text x="688" y="824" font-weight="600">TH-0915-B</text>
      <text x="688" y="842" font-size="12" fill-opacity="0.5">40 t · Gate</text>
      <rect x="900" y="814" width="88" height="26" rx="13" fill="#eef1f6"/>
      <text x="944" y="832" text-anchor="middle" font-size="12" font-weight="600" fill="#1c2141" fill-opacity="0.6">Queued</text>
    </g>
  </g>
</svg>
