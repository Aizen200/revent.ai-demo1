    <rect x="874" y="312" width="130" height="28" rx="14" fill="#e1eeff"/>
    <path transform="translate(892 326)" d="M0-7C.6-2 2-.6 7 0 2 .6.6 2 0 7-.6 2-2 .6-7 0-2-.6-.6-2 0-7z" fill="#007aff"/>
    <text x="906" y="331" font-size="13" fill="#007aff" font-weight="600">AI optimised</text>
    <g font-size="12" fill="#1c2141" fill-opacity="0.45" text-anchor="middle">
