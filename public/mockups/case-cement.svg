<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 1048" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2141"/>
      <stop offset="1" stop-color="#007aff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#d6e6ff"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b9bff"/>
      <stop offset="1" stop-color="#004fba"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#004fba" flood-opacity="0.16"/>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fef3c7"/>
      <rect width="4" height="10" fill="#f59e0b" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1184" height="1048" fill="url(#bg)"/>

  <g transform="translate(64 72)">
    <rect width="1056" height="904" rx="24" fill="#fff" filter="url(#sh)"/>
    <circle cx="30" cy="28" r="6.5" fill="#ff5f57"/>
    <circle cx="52" cy="28" r="6.5" fill="#febc2e"/>
    <circle cx="74" cy="28" r="6.5" fill="#28c840"/>
    <text x="528" y="33" text-anchor="middle" font-size="15" fill="#1c2141" fill-opacity="0.5">Revent MIS · Cement Plant</text>
    <rect y="56" width="1056" height="1" fill="#007aff" fill-opacity="0.12"/>

    <!-- sidebar -->
    <path d="M0 57h220v847H24a24 24 0 0 1-24-24z" fill="#f5f9ff"/>
    <rect x="24" y="84" width="34" height="34" rx="9" fill="#007aff"/>
    <text x="41" y="107" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">C</text>
    <text x="70" y="99" font-size="15" font-weight="600" fill="#1c2141">Sahel Cement</text>
    <text x="70" y="116" font-size="12" fill="#1c2141" fill-opacity="0.5">Senegal</text>
    <rect x="16" y="150" width="188" height="40" rx="10" fill="#e1eeff"/>
    <g font-size="15" fill="#1c2141" fill-opacity="0.7">
      <text x="44" y="175" fill="#007aff" fill-opacity="1" font-weight="600">Overview</text>
      <text x="44" y="221">Production</text>
      <text x="44" y="269">Silos &amp; inventory</text>
      <text x="44" y="317">Dispatch</text>
      <text x="44" y="365">Compliance</text>
      <text x="44" y="413">Capacity</text>
    </g>
    <g fill="#007aff">
      <rect x="28" y="165" width="8" height="8" rx="2"/>
      <rect x="28" y="211" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="259" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="307" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="355" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="403" width="8" height="8" rx="2" opacity="0.35"/>
    </g>

    <!-- header -->
    <text x="252" y="112" font-size="28" font-weight="600" fill="#1c2141" letter-spacing="-0.5">Plant overview</text>
    <text x="252" y="140" font-size="15" fill="#1c2141" fill-opacity="0.55">Kiln line 1 · Shift B · Thu 16 Oct</text>
    <rect x="904" y="88" width="120" height="34" rx="17" fill="#dcfce7"/>
    <circle cx="926" cy="105" r="5" fill="#16a34a"/>
    <text x="940" y="110" font-size="14" font-weight="600" fill="#15803d">Running</text>

