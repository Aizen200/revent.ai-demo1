<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f8ff"/>
      <stop offset="1" stop-color="#dbe8ff"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5aacff"/>
      <stop offset="0.6" stop-color="#007aff"/>
      <stop offset="1" stop-color="#1c2141"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#004fba" flood-opacity="0.16"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g stroke="#007aff" stroke-opacity="0.08">
    <path d="M0 80H640M0 160H640M0 240H640M0 320H640M80 0V400M160 0V400M240 0V400M320 0V400M400 0V400M480 0V400M560 0V400"/>
  </g>

  <!-- input: customer message -->
  <g filter="url(#sh)">
    <rect x="28" y="104" width="190" height="192" rx="18" fill="#fff"/>
  </g>
  <text x="48" y="136" font-size="12" font-weight="600" fill="#1c2141" fill-opacity="0.5" letter-spacing="0.4">NEW ORDER · WHATSAPP</text>
  <rect x="44" y="150" width="158" height="62" rx="14" fill="#e1eeff"/>
  <text x="58" y="174" font-size="13" fill="#1c2141">Need 500 m D-118</text>
  <text x="58" y="194" font-size="13" fill="#1c2141">indigo, deliver Friday</text>
  <rect x="44" y="224" width="120" height="14" rx="7" fill="#1c2141" fill-opacity="0.08"/>
  <rect x="44" y="246" width="150" height="14" rx="7" fill="#1c2141" fill-opacity="0.08"/>
  <rect x="44" y="268" width="90" height="14" rx="7" fill="#1c2141" fill-opacity="0.08"/>

  <!-- flow lines -->
  <g fill="none" stroke="#007aff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 8">
    <path d="M218 200H272"/>
    <path d="M368 200C392 200 392 116 422 116"/>
    <path d="M368 200C396 200 396 172 422 172"/>
    <path d="M368 200C396 200 396 228 422 228"/>
    <path d="M368 200C392 200 392 284 422 284"/>
  </g>

  <!-- AI orb -->
  <circle cx="320" cy="200" r="46" fill="#007aff" opacity="0.45" filter="url(#glow)"/>
  <circle cx="320" cy="200" r="66" fill="none" stroke="#007aff" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="320" cy="200" r="84" fill="none" stroke="#007aff" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="320" cy="200" r="46" fill="url(#orb)"/>
  <path transform="translate(320 196)" d="M0-20C2-6 6-2 20 0 6 2 2 6 0 20-2 6-6 2-20 0-6-2-2-6 0-20z" fill="#fff"/>
  <path transform="translate(338 178)" d="M0-6C.6-2 2-.6 6 0 2 .6.6 2 0 6-.6 2-2 .6-6 0-2-.6-.6-2 0-6z" fill="#fff" opacity="0.85"/>
  <text x="320" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#007aff">Revent AI</text>

  <!-- outputs -->
  <g font-size="14" font-weight="600" fill="#1c2141">
    <g filter="url(#sh)">
      <rect x="422" y="94" width="190" height="44" rx="12" fill="#fff"/>
      <rect x="422" y="150" width="190" height="44" rx="12" fill="#fff"/>
      <rect x="422" y="206" width="190" height="44" rx="12" fill="#fff"/>
      <rect x="422" y="262" width="190" height="44" rx="12" fill="#fff"/>
    </g>
    <text x="442" y="121">Quotation</text>
    <text x="442" y="177">Purchase order</text>
    <text x="442" y="233">Invoice</text>
    <text x="442" y="289">Delivery challan</text>
    <g fill="#16a34a">
      <circle cx="590" cy="116" r="10"/>
      <circle cx="590" cy="172" r="10"/>
      <circle cx="590" cy="228" r="10"/>
    </g>
    <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M585 116l3.5 3.5 6-7"/>
      <path d="M585 172l3.5 3.5 6-7"/>
      <path d="M585 228l3.5 3.5 6-7"/>
    </g>
    <circle cx="590" cy="284" r="10" fill="none" stroke="#007aff" stroke-width="2.5" stroke-dasharray="36 30"/>
  </g>
</svg>
