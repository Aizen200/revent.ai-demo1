<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 1048" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2141"/>
      <stop offset="1" stop-color="#007aff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#d6e6ff"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#004fba" flood-opacity="0.16"/>
    </filter>
    <pattern id="stripe" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="22" height="22" fill="#1e3a8a"/>
      <rect width="8" height="22" fill="#4f7fe0"/>
    </pattern>
    <pattern id="check" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#f4e3c8"/>
      <rect width="14" height="28" fill="#c9773a" opacity="0.55"/>
      <rect width="28" height="14" fill="#c9773a" opacity="0.45"/>
    </pattern>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#0f766e"/>
      <circle cx="9" cy="9" r="3.2" fill="#a7f3d0"/>
    </pattern>
    <pattern id="paisley" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#9f1239"/>
      <circle cx="12" cy="12" r="7" fill="none" stroke="#fda4af" stroke-width="2.5"/>
      <circle cx="32" cy="30" r="5" fill="#fb7185"/>
      <circle cx="12" cy="12" r="2" fill="#fecdd3"/>
    </pattern>
  </defs>

  <rect width="1184" height="1048" fill="url(#bg)"/>

  <g transform="translate(64 72)">
    <rect width="1056" height="904" rx="24" fill="#fff" filter="url(#sh)"/>
    <!-- title bar -->
    <circle cx="30" cy="28" r="6.5" fill="#ff5f57"/>
    <circle cx="52" cy="28" r="6.5" fill="#febc2e"/>
    <circle cx="74" cy="28" r="6.5" fill="#28c840"/>
    <text x="528" y="33" text-anchor="middle" font-size="15" fill="#1c2141" fill-opacity="0.5">Revent MIS · Textile Trading</text>
    <rect y="56" width="1056" height="1" fill="#007aff" fill-opacity="0.12"/>

    <!-- sidebar -->
    <path d="M0 57h220v847H24a24 24 0 0 1-24-24z" fill="#f5f9ff"/>
    <rect x="24" y="84" width="34" height="34" rx="9" fill="#007aff"/>
    <text x="41" y="107" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">W</text>
    <text x="70" y="99" font-size="15" font-weight="600" fill="#1c2141">Weave &amp; Co.</text>
    <text x="70" y="116" font-size="12" fill="#1c2141" fill-opacity="0.5">Mumbai</text>
    <g font-size="15" fill="#1c2141" fill-opacity="0.7">
      <text x="44" y="175">Dashboard</text>
      <rect x="16" y="196" width="188" height="40" rx="10" fill="#e1eeff" fill-opacity="1"/>
      <text x="44" y="221" fill="#007aff" fill-opacity="1" font-weight="600">Orders</text>
      <text x="44" y="269">Designs</text>
      <text x="44" y="317">Raw material</text>
      <text x="44" y="365">Packaging</text>
      <text x="44" y="413">Invoices</text>
      <text x="44" y="461">Reports</text>
    </g>
    <g fill="#007aff">
      <rect x="28" y="165" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="211" width="8" height="8" rx="2"/>
      <rect x="28" y="259" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="307" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="355" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="403" width="8" height="8" rx="2" opacity="0.35"/>
      <rect x="28" y="451" width="8" height="8" rx="2" opacity="0.35"/>
    </g>

