    <rect x="252" y="168" width="772" height="108" rx="16" fill="#f5f9ff"/>
    <g stroke-width="4">
      <line x1="320" y1="208" x2="790" y2="208" stroke="#d6e4f7"/>
      <line x1="320" y1="208" x2="790" y2="208" stroke="#007aff" stroke-dasharray="470 1000"/>
    </g>
    <g>
      <circle cx="320" cy="208" r="16" fill="#007aff"/>
      <circle cx="477" cy="208" r="16" fill="#007aff"/>
      <circle cx="634" cy="208" r="16" fill="#007aff"/>
      <circle cx="790" cy="208" r="16" fill="#fff" stroke="#007aff" stroke-width="4"/>
      <circle cx="790" cy="208" r="6" fill="#007aff"/>
      <circle cx="947" cy="208" r="16" fill="#fff" stroke="#d6e4f7" stroke-width="4"/>
      <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M313 208l5 5 9-10"/>
        <path d="M470 208l5 5 9-10"/>
        <path d="M627 208l5 5 9-10"/>
