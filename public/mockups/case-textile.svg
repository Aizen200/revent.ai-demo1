    <path transform="translate(872 316)" d="M0-7C.6-2 2-.6 7 0 2 .6.6 2 0 7-.6 2-2 .6-7 0-2-.6-.6-2 0-7z" fill="#007aff"/>
    <text x="886" y="321" font-size="13" fill="#007aff" font-weight="600">AI product shots</text>
    <g>
      <rect x="252" y="340" width="178" height="140" rx="14" fill="url(#stripe)"/>
      <rect x="450" y="340" width="178" height="140" rx="14" fill="url(#check)"/>
