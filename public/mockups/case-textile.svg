    <g fill="#007aff" fill-opacity="0.12">
      <rect x="252" y="640" width="772" height="1"/>
      <rect x="252" y="686" width="772" height="1"/>
      <rect x="252" y="732" width="772" height="1"/>
    </g>
    <g font-size="15" fill="#1c2141">
      <text x="276" y="670">Cotton yarn 40s</text>
      <text x="560" y="670">860 kg</text>
      <text x="720" y="670">420 kg</text>
      <text x="276" y="716">Polyester blend</text>
      <text x="560" y="716">310 kg</text>
      <text x="720" y="716">300 kg</text>
      <text x="276" y="762">Reactive dye · Indigo</text>
      <text x="560" y="762">48 kg</text>
      <text x="720" y="762">12 kg</text>
    </g>
    <g font-size="13" font-weight="600">
      <rect x="880" y="652" width="84" height="26" rx="13" fill="#dcfce7"/>
      <text x="922" y="670" text-anchor="middle" fill="#15803d">In stock</text>
      <rect x="880" y="698" width="84" height="26" rx="13" fill="#fef3c7"/>
      <text x="922" y="716" text-anchor="middle" fill="#b45309">Reorder</text>
      <rect x="880" y="744" width="84" height="26" rx="13" fill="#dcfce7"/>
      <text x="922" y="762" text-anchor="middle" fill="#15803d">In stock</text>
    </g>

    <!-- documents -->
    <rect x="252" y="804" width="376" height="72" rx="16" fill="url(#ai)"/>
    <rect x="272" y="822" width="36" height="36" rx="10" fill="#fff" fill-opacity="0.16"/>
    <path transform="translate(290 840)" d="M0-11C1-3 3-1 11 0 3 1 1 3 0 11-1 3-3 1-11 0-3-1-1-3 0-11z" fill="#fff"/>
    <text x="322" y="836" font-size="15" font-weight="600" fill="#fff">AI: reorder polyester by 18 Oct</text>
    <text x="322" y="856" font-size="13" fill="#fff" fill-opacity="0.7">Stock covers this order only</text>

    <rect x="648" y="804" width="376" height="72" rx="16" fill="#f5f9ff"/>
    <rect x="668" y="822" width="36" height="36" rx="10" fill="#e1eeff"/>
    <text x="686" y="846" text-anchor="middle" font-size="17" font-weight="700" fill="#007aff">₹</text>
    <text x="718" y="836" font-size="15" font-weight="600" fill="#1c2141">Invoice INV-3381</text>
    <text x="718" y="856" font-size="13" fill="#1c2141" fill-opacity="0.55">₹4,86,000 · GST included</text>
    <rect x="928" y="822" width="76" height="36" rx="10" fill="#007aff"/>
    <text x="966" y="845" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Send</text>
  </g>
</svg>
