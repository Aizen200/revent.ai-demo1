      <text x="450" y="524" fill="#1c2141" fill-opacity="0.5">300 m</text>
      <text x="648" y="504" font-weight="600" fill="#1c2141">D-097 Teal dot</text>
      <text x="648" y="524" fill="#1c2141" fill-opacity="0.5">250 m</text>
      <text x="846" y="504" font-weight="600" fill="#1c2141">D-311 Ruby paisley</text>
      <text x="846" y="524" fill="#1c2141" fill-opacity="0.5">250 m</text>
    </g>

