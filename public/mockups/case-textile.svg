    <text x="252" y="140" font-size="15" fill="#1c2141" fill-opacity="0.55">Shah Fabrics · 1,200 m cotton poplin · Due 24 Oct</text>
    <rect x="874" y="88" width="150" height="34" rx="17" fill="#e1eeff"/>
    <circle cx="896" cy="105" r="5" fill="#007aff"/>
    <text x="910" y="110" font-size="14" font-weight="600" fill="#007aff">In production</text>

