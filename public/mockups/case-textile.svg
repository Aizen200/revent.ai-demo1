    <text x="252" y="574" font-size="18" font-weight="600" fill="#1c2141">Raw material</text>
    <rect x="252" y="592" width="772" height="188" rx="16" fill="#fff" stroke="#007aff" stroke-opacity="0.14" stroke-width="1.5"/>
    <g font-size="13" fill="#1c2141" fill-opacity="0.5" font-weight="600" letter-spacing="0.4">
