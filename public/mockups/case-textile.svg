      <text x="477" y="254" font-weight="600">Weaving</text>
      <text x="634" y="254" font-weight="600">Dyeing</text>
      <text x="790" y="254" font-weight="600" fill="#007aff">Packing</text>
      <text x="947" y="254" fill-opacity="0.45">Dispatch</text>
    </g>

