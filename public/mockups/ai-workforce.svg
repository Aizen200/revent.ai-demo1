<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter, -apple-system, 'Segoe UI', 'Noto Sans Devanagari', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f8ff"/>
      <stop offset="1" stop-color="#dbe8ff"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2141"/>
      <stop offset="1" stop-color="#007aff"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6478"/>
      <stop offset="1" stop-color="#2b3142"/>
    </linearGradient>
    <pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <rect width="12" height="12" fill="#1e3a8a"/>
      <rect width="5" height="12" fill="#4f7fe0"/>
    </pattern>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#004fba" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="320" cy="200" r="170" fill="#007aff" opacity="0.06"/>

  <!-- phone 1: task list -->
  <g filter="url(#sh)">
    <rect x="118" y="22" width="180" height="356" rx="30" fill="#1c2141"/>
  </g>
  <rect x="126" y="30" width="164" height="340" rx="23" fill="#fff"/>
  <rect x="184" y="38" width="48" height="10" rx="5" fill="#1c2141"/>
  <text x="140" y="80" font-size="15" font-weight="600" fill="#1c2141">Today's work</text>
  <rect x="140" y="92" width="76" height="24" rx="12" fill="#eef4fc"/>
  <rect x="142" y="94" width="36" height="20" rx="10" fill="#007aff"/>
  <text x="160" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">EN</text>
  <text x="197" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#1c2141">हिं</text>

  <rect x="140" y="128" width="136" height="64" rx="14" fill="#e1eeff"/>
  <text x="152" y="152" font-size="13" font-weight="600" fill="#1c2141">TX-2041</text>
  <text x="152" y="170" font-size="11" fill="#1c2141" fill-opacity="0.6">Pack 24 bales</text>
  <rect x="152" y="178" width="112" height="6" rx="3" fill="#fff"/>
  <rect x="152" y="178" width="78" height="6" rx="3" fill="#007aff"/>

  <rect x="140" y="202" width="136" height="64" rx="14" fill="#eef4fc"/>
  <text x="152" y="226" font-size="13" font-weight="600" fill="#1c2141">TX-2044</text>
  <text x="152" y="244" font-size="11" fill="#1c2141" fill-opacity="0.6">Dyeing · lot 7</text>
  <rect x="152" y="252" width="112" height="6" rx="3" fill="#fff"/>
  <rect x="152" y="252" width="30" height="6" rx="3" fill="#007aff"/>

  <rect x="140" y="296" width="136" height="54" rx="14" fill="#007aff"/>
  <path d="M174 318a7 7 0 1 1 0 .1M168 312h4l2-4h8l2 4h4v16h-20z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <text x="198" y="328" font-size="14" font-weight="600" fill="#fff">Scan roll</text>

  <!-- phone 2: AI photo check -->
  <g filter="url(#sh)">
    <rect x="342" y="22" width="180" height="356" rx="30" fill="#1c2141"/>
  </g>
  <rect x="350" y="30" width="164" height="340" rx="23" fill="url(#cam)"/>
  <rect x="408" y="38" width="48" height="10" rx="5" fill="#1c2141"/>
  <!-- fabric roll -->
  <rect x="380" y="112" width="104" height="120" rx="8" fill="url(#stripe)"/>
  <ellipse cx="432" cy="112" rx="52" ry="12" fill="#5b7fd6"/>
  <ellipse cx="432" cy="112" rx="14" ry="4" fill="#2b3142"/>
  <!-- detection box -->
  <g fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round">
    <path d="M370 112v-18h18M476 94h18v18M494 222v18h-18M388 240h-18v-18"/>
  </g>
  <rect x="370" y="72" width="124" height="20" rx="6" fill="#16a34a"/>
  <text x="432" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">D-118 · 98% match</text>

  <rect x="360" y="254" width="144" height="104" rx="18" fill="#fff"/>
  <rect x="372" y="266" width="70" height="20" rx="10" fill="url(#ai)"/>
  <path transform="translate(383 276)" d="M0-5.5C.5-1.8 1.8-.5 5.5 0 1.8.5.5 1.8 0 5.5-.5 1.8-1.8.5-5.5 0-1.8-.5-.5-1.8 0-5.5z" fill="#fff"/>
  <text x="392" y="280" font-size="10" font-weight="600" fill="#fff">AI check</text>
  <text x="372" y="306" font-size="13" font-weight="600" fill="#1c2141">Is this the right roll?</text>
  <rect x="372" y="318" width="58" height="30" rx="10" fill="#16a34a"/>
  <text x="401" y="338" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Yes</text>
  <rect x="436" y="318" width="56" height="30" rx="10" fill="#eef1f6"/>
  <text x="464" y="338" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2141">No</text>
</svg>
